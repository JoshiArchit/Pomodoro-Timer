name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show build environment
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes | grep Watch

      - name: Install xcpretty
        run: gem install xcpretty

      - name: List schemes
        run: xcodebuild -project PomodoroTimer.xcodeproj -list

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project PomodoroTimer.xcodeproj \
            -scheme PomodoroWatchApp \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=latest' \
            -only-testing:PomodoroWatchAppTests \
            | xcpretty

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project PomodoroTimer.xcodeproj \
            -scheme PomodoroWatchApp \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=latest' \
            -only-testing:PomodoroWatchAppUITests \
            | xcpretty
